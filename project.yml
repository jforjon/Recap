name: Recap
options:
  bundleIdPrefix: com.jonchambers
  deploymentTarget:
    iOS: "26.0"

targets:
  Recap:
    type: application
    platform: iOS
    sources:
      - path: Recap
    info:
      path: Recap/Resources/Info.plist
      properties:
        CFBundleDisplayName: recap
        # Version shown in the App Store, and the build number. Every TestFlight
        # upload needs a higher build number: bump CURRENT_PROJECT_VERSION below.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS is used, so there is nothing to declare for export
        # compliance — this skips that question on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "recap needs microphone access to record talks and sessions."
        NSSpeechRecognitionUsageDescription: "recap transcribes your recordings to text on your device."
        UIBackgroundModes:
          - audio
          # Lets CloudKit wake the app with a silent push when another device
          # changes something, so SwiftData can pull it in.
          - remote-notification
        UIAppFonts:
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-Bold.ttf
          - RobotoMono-Regular.ttf
          - RobotoMono-Medium.ttf
        FEEDBACK_SCRIPT_ID: $(FEEDBACK_SCRIPT_ID)
        # Read only by the one-off import of Supabase-era recordings
        # (SupabaseImport.swift). Remove with it.
        SUPABASE_PROJECT_REF: $(SUPABASE_PROJECT_REF)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        FEEDBACK_SECRET: $(FEEDBACK_SECRET)
    # iCloud, for two things in one container:
    #   - CloudKit: the SwiftData store (`RecapStore`) mirrors to the user's
    #     private database. `aps-environment` is the silent push that tells the
    #     app another device changed something.
    #   - iCloud Documents: saved audio, when the user picks "In iCloud".
    #
    # Needs a paid Apple Developer team — a free personal team can't sign these.
    # The container `iCloud.com.jonchambers.recap` must be registered in the
    # developer portal and enabled on the App ID (see PLAN.md). Without it the
    # store falls back to local-only and AudioStore to on-device storage.
    entitlements:
      path: Recap/Resources/Recap.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jonchambers.recap
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.jonchambers.recap
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        aps-environment: development
    configFiles:
      Debug: Recap/Resources/Secrets.xcconfig
      Release: Recap/Resources/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonchambers.recap
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Signing has to live here, not just in Xcode. The .xcodeproj is
        # generated and gitignored, so a team set through the Signing &
        # Capabilities editor is wiped by the next `xcodegen generate` — and
        # because the Simulator doesn't sign, the breakage only shows up when
        # building to a device ("Signing for 'Recap' requires a development
        # team"). Keeping it in project.yml makes every regenerated project
        # device-buildable.
        DEVELOPMENT_TEAM: 2H7K7S5Y37
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_ASSET_PATHS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
